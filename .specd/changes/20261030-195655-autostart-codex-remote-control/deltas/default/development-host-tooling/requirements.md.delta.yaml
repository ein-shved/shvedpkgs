- op: added
  position:
    parent:
      type: section
      matches: ^Requirements$
    after:
      type: section
      matches: ^Requirement:\ Tooling\ selection\ belongs\ to\ development\ host\ configuration$
  content: |
    ## Requirement: Development hosts start Codex remote control before user login

    Development hosts must automatically start the shared Codex daemon with
    remote control enabled for the primary user when the computer boots.
    Startup must not require that user to log in or manually start Codex.
    Logging out must not stop the daemon solely because the user's login
    session ended.

    Rationale: remote access must remain available when nobody is logged in
    locally, including after a reboot or the end of a local login session.

    ### Scenario: Startup without a local login

    - GIVEN a development host with the primary user's Codex authentication already configured
    - WHEN the computer boots and the required network connectivity is available
    - THEN the shared Codex daemon starts with remote control enabled
    - AND the primary user need not log in locally or issue a daemon startup command

    ### Scenario: Availability after logout

    - GIVEN the primary user's shared Codex daemon is running on a development host
    - WHEN the primary user logs out of their local login session
    - THEN the daemon remains running independently of that login session
