- op: added
  position:
    parent:
      type: section
      matches: ^Requirements$
    after:
      type: section
      matches: ^Requirement:\ Tooling\ selection\ belongs\ to\ development\ host\ configuration$
  content: |
    ### Requirement: Development hosts start Codex remote control before user login

    #### Scenario: Evaluated unit implements boot startup

    - GIVEN a development-host NixOS configuration with an existing primary user
    - WHEN its evaluated `services.codex` options and generated `codex.service` are inspected
    - THEN the service and remote control are enabled by default
    - AND the unit is wanted by `multi-user.target` and wants and follows `network-online.target`
    - AND `RequiresMountsFor` covers the configured home and Codex state directory
    - AND the unit uses `Type=simple`, `Restart=on-failure`, and `RestartSec=5s`
    - AND its foreground command runs the selected package's `codex app-server --remote-control --listen unix://`
    - AND it does not invoke managed daemon bootstrap or depend on a user login target

    #### Scenario: Daemon is available before login and after logout

    - GIVEN a NixOS development host or VM with the primary user's authentication configured and network connectivity available
    - WHEN it boots without a local login by that user
    - THEN `systemctl is-active codex.service` reports `active`
    - AND `systemctl show codex.service -p MainPID -p User` identifies the supervised process and primary account
    - AND an authorised remote client can submit work and receive a successful result
    - WHEN the primary user subsequently logs in and logs out
    - THEN the service remains active and the remote client can still submit work
    - AND `journalctl -u codex.service -b` shows no shutdown caused by logout
