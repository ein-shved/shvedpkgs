- op: modified
  selector:
    type: section
    matches: '^Artifact Status$'
  rename: Technical Checks
  content: |
    ### Check: Schema and project discovery

    - Covers: [SpecD Project
      Configuration](system.md#specd-project-configuration), [SDD
      Schema](system.md#sdd-schema),
      [REQ-002](requirements.md#req-002-specd-provides-machine-readable-workflow-state).
    - Method: Run `specd schema validate --format text`, `specd schema show
      --format toon`, and `specd project status --format toon`. Inspect the
      configured schema's template paths and their files.
    - Evidence: Schema validation succeeds; the project selects
      `./schemas/sdd/schema.yaml`; the artifact set is exactly `proposal`,
      `requirements`, `system`, `validate`, `adrs`, and `plan`. Scopes and
      dependencies match SDD Schema; only `adrs` is optional and only `plan` has
      tasks. Every referenced template exists; there is no change Context
      definition or template.

    ### Check: Delivered instructions and rule order

    - Covers: [Artifact Boundary
      Instructions](system.md#artifact-boundary-instructions), [Artifact
      Boundary Self-Review](system.md#artifact-boundary-self-review), [Review
      Before Structural
      Validation](system.md#review-before-structural-validation).
    - Method: For an existing design change, run `specd changes
      artifact-instruction <change> <artifact> --format toon` for each of the
      six artifact IDs. Read the expanded instructions, templates, `rulesPre`,
      and `rulesPost`. Run `specd changes hook-instruction <change> designing
      --phase pre --format text` and inspect its repair guidance.
    - Evidence: Each artifact receives its documented content boundaries and
      template. Requirements receives intent review in `rulesPre`. Every
      artifact's `rulesPost` orders existing composition checks before boundary
      self-review and human review last. Review guidance requires
      current-content approval before structural validation, including optional
      artifacts, no-op decisions, and upstream repairs. Designing guidance
      retains that boundary when validation fails.

    ### Check: Short intent and correction loop

    - Covers: [Intent Review Before
      Requirements](system.md#intent-review-before-requirements).
    - Method: In a fresh sub-agent session, supply a proposal to improve schema
      guidance for needs already covered by the fixture's requirements. Request
      requirements without previously agreeing an allocation. Inspect the first
      reply and file/tool activity. Correct one destination, inspect the next
      reply, then agree the corrected allocation and request continuation.
    - Evidence: Before drafting, the agent shows only relevant `<two- or
      three-word topic> — <artifact>` lines. Every correction produces the
      entire corrected list in that format. Requirements and downstream artifact
      files are absent until agreement. Already covered needs can produce a
      `no-op` requirements delta. Continuation reuses the agreed allocation
      without asking for it again.
    - Notes: Use the commands below from the source checkout to bootstrap each
      probe's own temporary Git project with its schema and Codex skills.
      Before launching the sub-agent, run fixture-local `specd project status`
      and inspect its `specd.yaml`. Verify its project root, code roots, specs,
      change storage, and lock location are inside the temporary project.
      Fixtures have their own changes and no workspace or storage references
      to the source project. Use explicit fixture working directories and
      `--config` paths for test CLI calls; each concurrent probe gets its own
      project. Keep production change state outside the probes. Start the
      sub-agent without the parent conversation or expected answers.
      The controlling agent sends the staged user messages and inspects replies,
      filesystem snapshots, and actual CLI calls recorded by a fixture-local
      logging wrapper at each stop. Simulated approvals apply only to fixture
      content. Keep assertions in the controller; schema text inspection alone
      does not pass this probe.

    ```sh
    SDD_PROBE_ROOT="$(mktemp -d /tmp/specd-probe.XXXXXX)"
    git init -q "$SDD_PROBE_ROOT"
    nix run --no-write-lock-file .#specd-bootstrap -- \
      --target "$SDD_PROBE_ROOT" --agent codex
    ```

    ### Check: Boundary self-review catches misplaced content

    - Covers: [Artifact Boundary
      Self-Review](system.md#artifact-boundary-self-review), [Artifact Boundary
      Instructions](system.md#artifact-boundary-instructions).
    - Method: Supply each draft fragment below to a fresh sub-agent in the
      relevant design step and ask it to finish authoring the artifact.
      Inspect the artifact it presents for review and its tool activity before
      that presentation.
    - Evidence: The presented drafts contain the corrections below, retain
      explicit owner references, and contain no added self-assessment section.
      Any required change to approved upstream content is surfaced rather than
      silently applied.

    - Draft fragment: Requirement: "This patch must preserve existing
      paragraphs." Existing requirements already cover the underlying need.
      Expected correction: The patch constraint stays out of requirements;
      unchanged needs use no-op or retain their existing owning requirement.
    - Draft fragment: System: "The process must preserve approved plans." No
      mechanism or requirement reference is supplied.
      Expected correction: The architecture names the schema
      instruction/hook that governs plan edits and links to its owning
      requirement.
    - Draft fragment: Validate: "This check is useful because it protects
      the design." No action, result, or reference is supplied.
      Expected correction: A concrete Method, expected Evidence, and Covers
      reference replace the motivation prose.

    - Notes: Use the same isolated sub-agent setup and command recording as
      [Short intent and correction loop](#check-short-intent-and-correction-loop).
      Each fragment gets a fresh session; record the presented content and
      filesystem changes alongside the CLI log.

    ### Check: Content approval precedes structural validation

    - Covers: [Review Before Structural
      Validation](system.md#review-before-structural-validation).
    - Method: In a fresh isolated sub-agent session, inspect recorded CLI calls
      after an artifact is presented, after a revision request, and after selecting
      all-at-once generation without content approval. Then explicitly approve
      the current artifact content. Exercise the repair path with an explicitly
      approved, structurally invalid fixture artifact; inspect the response to
      the validation failure and any resulting edits.
    - Evidence: No `specd changes validate` call precedes approval of its
      current content. The approved artifact may then be validated. A repair
      that changes content is shown as a diff and waits for renewed approval
      before revalidation. The agent does not silently edit or validate
      unapproved upstream artifacts. A state-only dependency repair preserves
      approval of unchanged reviewed content. Tests and technical inspections
      are not treated as artifact-content approval.
    - Notes: Use the isolated sub-agent setup from
      [Short intent and correction loop](#check-short-intent-and-correction-loop).
      Keep deliberate structural defects in fixture content. Record the tested
      inputs, validation failure, diff, and command sequence; do not infer this
      behaviour merely from a successful structural validation.

    ### Check: Implementation guidance and plan drift

    - Covers: [Approved Plan During
      Implementation](system.md#approved-plan-during-implementation),
      [REQ-006](requirements.md#req-006-changes-that-modify-behavior-pass-through-specd-artifacts).
    - Method: Run `specd changes hook-instruction <change> <step> --phase pre
      --format text` for `implementing`, `verifying`, and `archiving`; inspect
      the emitted plan instruction and template. In a disposable change with an
      approved, validated plan, record `specd changes status <change> --format
      text`, change one completed item's `[ ]` to `[x]`, and read status again.
      Restore that checkbox, append a test sentence to the fixture plan, and
      read status once more.
    - Evidence: Guidance permits only completion marks during implementation,
      prohibits plan additions and requests to append, and requires an actual
      design error plus user permission for return to design. Checkbox progress
      preserves the validated plan status and hash; the added sentence produces
      artifact drift or pending review. Progress reporting remains outside the
      approved plan.
    - Notes: Deliberate plan mutations belong only to the disposable CLI
      fixture, not the implementation plan being executed.

    ### Check: Artifact content and references

    - Covers: [Traceability References](system.md#traceability-references),
      [Artifact Boundary
      Instructions](system.md#artifact-boundary-instructions),
      [REQ-005](requirements.md#req-005-normative-sdd-artifacts-describe-the-current-architecture),
      [REQ-007](requirements.md#req-007-validation-checks-remain-distinct-from-acceptance-scenarios).
    - Method: Inspect each affected spec artifact through `specd changes
      spec-preview <change> <specId> --artifact <artifact> --format text`. For a
      no-op whose preview is unavailable, read the base with `specd specs show
      <specId> --artifact <artifact> --format text`. Follow each architecture
      point's requirement links and every check's Covers links to their owning
      headings. Read change-scoped proposal and plan files directly.
    - Evidence: References resolve at the owning point's granularity. System
      explains mechanisms; validate checks have a concrete Method, expected
      Evidence, and Covers reference. Notes contain only execution prerequisites
      or limits. Acceptance scenarios remain inside their owning requirements,
      and validation contains no purpose or motivation prose. A no-op retains
      the base requirements unchanged.

    ### Check: Human and agent process guidance agree

    - Covers: [SpecD-Owned SDD Locations](system.md#specd-owned-sdd-locations),
      [SDD Process Discoverability](system.md#sdd-process-discoverability),
      [REQ-001](requirements.md#req-001-existing-sdd-process-remains-authoritative),
      [REQ-003](requirements.md#req-003-developers-can-find-current-sdd-process-rules).
    - Method: Read `CONTRIBUTING.md` and follow its process links. Read the
      English and Russian process documents through `specd specs show
      default:000-sdd-process --format text`, and project instructions through
      `specd project context --format text`. Compare their artifact roles,
      intent review, self-review, validation approval, and implementation plan
      rules with the emitted schema instructions.
    - Evidence: Contribution links resolve; English rules remain authoritative;
      Russian text is a complete aligned translation. Project guidance and both
      process versions describe the same boundaries and review sequence as the
      schema. None instructs agents to author a separate change Context
      artifact. Project context compilation and discovery memory remain
      available.
