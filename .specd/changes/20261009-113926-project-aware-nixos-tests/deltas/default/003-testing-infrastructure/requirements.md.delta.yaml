  content: |
    ## REQ-004: Preserve existing package and test use

    Adding support for project capabilities in NixOS tests must preserve existing
    package use and existing package-test behavior, including tests that do not
    use project capabilities.

    ### Scenario: Continue using an existing package

    - GIVEN an existing usable package.
    - WHEN support for project capabilities in NixOS tests is introduced.
    - THEN the package remains usable without opting into project-aware testing.

    ### Scenario: Continue using an ordinary package test

    - GIVEN an existing NixOS package test that does not request project
      capabilities.
    - WHEN it is used after project-aware testing support is introduced.
    - THEN its existing definition remains usable and its expected behavior is
      preserved.
    - AND the author does not need to add project-specific configuration or
      unrelated inputs solely because the new testing support exists.
