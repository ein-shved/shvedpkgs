  content: |
    ## REQ-002: Exercise project capabilities in NixOS tests

    Test authors must be able to use the project's reusable NixOS module
    capabilities in test nodes without reconstructing the project's shared module
    environment separately for each test.

    Tests need to exercise the project capabilities themselves rather than
    maintain substitute definitions that may diverge from the project.

    ### Scenario: Use a reusable project capability in a test

    - GIVEN an author selects any reusable project NixOS module capability.
    - AND the author supplies the settings and inputs intrinsic to that
      capability.
    - WHEN the author configures a test node to exercise it.
    - THEN the capability is available in the node without the author
      reconstructing the project's shared module environment.

    ### Scenario: Exercise the project's behavior

    - GIVEN a project capability is configured in a test node and in a project
      system with equivalent relevant settings and inputs.
    - WHEN the test exercises that capability.
    - THEN it exercises the same project behavior rather than a substitute
      definition maintained for the test.


