  content: |
    ## REQ-003: Preserve existing package and test use

    Existing packages and ordinary NixOS package tests must remain usable
    without selecting project capabilities in tests.

    ### Scenario: Continue using an existing package

    - GIVEN an existing usable package.
    - WHEN a consumer uses the package without selecting project capabilities
      in tests.
    - THEN the package remains usable without opting into project-aware testing.

    ### Scenario: Continue using an ordinary package test

    - GIVEN an existing NixOS package test that does not request project
      capabilities.
    - WHEN the author runs the test using its existing definition.
    - THEN its existing definition remains usable and its expected behavior is
      preserved.
    - AND the author does not need to add project-specific configuration or
      unrelated inputs to use that definition.
