kind: schema
name: sdd
version: 1
description: Concise proposal and requirements, then system and code by work item.

artifacts:
  - id: proposal
    scope: change
    hasTasks: true
    output: proposal.md
    description: Short change intent and ordered high-level work items
    template: templates/proposal.md
    requires: []
    instruction: |
      Create the proposal as part of creating the change. Write a short problem
      statement and ordered numbered checkbox work items, each with a one-word
      name and one short sentence describing its purpose. Alongside the items,
      explicitly allocate this change's actual content among affected artifacts:
      name the needs/scenarios for requirements and interfaces/architecture for
      system, including unchanged owning needs when appropriate. Preserve item
      identities on correction. One item is enough for a small change. List all
      affected spec IDs. Keep supporting research and temporary continuation
      outside the artifact dependency graph.

      Set Participation to PENDING during proposal review. Complete independent
      agent review and corrections before presenting the proposal to the user.
      Resolve the user's proposal comments, then always ask the involvement
      question for this new change and wait for the answer before preparing
      requirements or the system skeleton. Earlier preferences do not replace
      this question. Offer exactly three levels:
      - full involvement: user reviews agent-reviewed requirements, each item's
        design and implemented code;
      - delegate code only: user reviews agent-reviewed requirements and item
        designs; agents implement and accept code autonomously;
      - full delegation: agents handle requirements, architecture and code
        autonomously after proposal review and the involvement answer.
      Independent design and separate code arbiters participate in every mode.
      Agent review and correction clearance precede every result's user review.
      Item/batch presentation is a separate preference, not a delegation level.

      Record the reviewed proposal revision, actual question/answer and selected
      level, replacing PENDING only after the answer. Resume the same reviewed
      proposal with its recorded answer without repeating the question.
    rules:
      post:
        - id: content-review
          instruction: &content-review |
            Reread the affected artifact, using the merged result for a delta.
            Correct misplaced content, contradictions and unsupported statements.
            Replace the wrong account and dependent explanations; keep correction
            history outside current contracts. Keep only text that resolves a
            concrete ambiguity. Apply the proposal's review boundary or, for
            downstream content, this change's recorded involvement mode.
            Complete independent agent review and corrections before any user review.
    preHashCleanup:
      - id: normalize-checkboxes
        pattern: '^([ \t]*-\s+)\[x\]'
        replacement: '$1[ ]'
    taskCompletionCheck:
      incompletePattern: '^\s*-\s+\[ \]'
      completePattern: '^\s*-\s+\[x\]'

  - id: requirements
    scope: spec
    output: requirements.md
    description: Needs, obligations and requirement-owned acceptance scenarios
    template: templates/requirements.md
    requires: [proposal]
    delta: true
    instruction: |
      Begin only after proposal review is complete, its user comments are resolved
      and this change's actual involvement answer is recorded. A PENDING choice
      keeps work at the proposal-review/question boundary.

      Describe independent user/project needs and satisfaction conditions for
      each affected spec. Reuse existing requirements and authoritative artifact
      rules; use a no-op delta when the needs remain unchanged. A defect in their
      realization may be corrected under an existing requirement. Ask whether
      the need remains meaningful if its internal mechanism or configuration
      interface changes. State imposed negative constraints with their observable
      violation and acceptance scenarios.

      Keep the existing requirements format:
      - Start with # Requirements.
      - Use ## REQ-<n>: <name> or ## Requirement: <name> for each requirement.
      - State the core need concisely; add rationale when useful.
      - Give every requirement at least one ### Scenario: <name> section inside it.
      - GIVEN is optional; WHEN and THEN are required; AND may extend any clause.
      - Use the consumer's requirement-level language. Internal configuration,
        module/file choices and migration mechanics belong elsewhere unless they
        are themselves part of the required external contract.
      Put examples, nuances and boundary cases in scenarios. A proposed requirement
      that merely refines another is usually a scenario under its existing owner.
    deltaInstruction: |
      Write deltas at {{change.path}}/deltas/<workspace>/<capability-path>/requirements.md.delta.yaml.
      Target whole requirement sections. Modified operations replace the body
      under the existing heading; added operations include the heading and body.
    validations:
      - id: has-requirement
        type: section
        matches: '^(REQ-[0-9]+:|Requirement:)'
        required: true
      - id: has-acceptance-scenario
        type: section
        matches: '^Scenario:'
        required: true
    rules:
      post:
        - id: content-review
          instruction: *content-review
        - id: requirements-review
          instruction: |
            Complete independent requirements review and corrections in every mode.
            Full involvement and code-only delegation then require user review
            and resolved comments before proceeding to the affected design.
            Full delegation accepts the reviewed requirements autonomously.

  - id: system
    scope: spec
    output: system.md
    description: External interface and concise architecture developed by work item
    template: templates/system.md
    requires: [requirements]
    delta: true
    instruction: |
      Prepare system content only after the reviewed proposal's comments are
      resolved and this change's actual involvement answer is recorded.

      Start the affected system content with the designed entity's external
      interface and a skeleton using exactly the proposal's item names and order.
      External means the entity's relevant boundary: public types/functions,
      REST, UI, CLI, protobuf, IOCTL, or another interface. Preserve and reference
      sufficient existing contracts; a narrow fix may use a no-op system delta.

      System owns current concepts, interfaces, configuration contracts, behavior,
      guarantees and invariants. For each item, record its role, named key
      participants, relationships with other modules and material external
      dependencies. Explain the arrangement or mechanism that realizes requirements
      and where its contracts are defined, so a reader can determine whether an
      implementation conforms. Define shared concepts once and keep architecture
      sufficient to distinguish a conforming implementation.

      Distinguish a reusable contract from values selected for an instance,
      deployment, policy or dataset. General framework contracts describe the
      reusable model; values defining a concrete delivered system may be part
      of that system's contract. An explicitly requested ADR records significant
      choice rationale; routine coding steps and temporary migration mechanics
      belong in implementation.

      Authoring examples use an illustrative host-update CLI with cli, config,
      deployment and completion modules.

      Good examples:
      - "host-update <host> --config <path> updates one configured target."
        Defines an external interface and target-selection contract.
      - "cli::Args uses clap to parse the public command."
        Names a module role and its argument-parsing library dependency.
      - "config::load produces Target; deployment::run consumes it; completion
        reads the shared command definition." Identifies module relationships
        and data flow.
      - "Deployment starts activation only after a successful build."
        States a material, assessable ordering invariant.
      - "Target contains public target settings; credentials remain in the SSH
        agent." Defines a data boundary and its external participant.
      - "A lock file records exact dependency revisions for deployment builds."
        Names a reproducibility mechanism whose underlying need can remain stable
        when the mechanism changes.

      Bad examples of System prose:
      - "Users can update their hosts." Repeats a need without its architecture.
      - "Create a map, loop over hosts and append each result."
        Gives ordinary coding steps that belong in implementation.
      - "The utility prints usage for an invalid set of arguments."
        Conventional correct CLI behavior and recitals of parsing-library
        facilities alone add no project-specific architecture.
      - "The function returns the constructed object as Result<Object, Error>."
        A standalone Rust idiom does not itself expose a significant contract;
        actual external API definitions and material error behavior can belong
        in system.
      - "Deployment may use SSH or a new service; the choice comes later."
        Leaves a material choice unresolved in a finished item's contract;
        pending questions belong with unfinished work.
      - "We first chose A, then the reviewer suggested B."
        Records discussion history instead of the current contract and mechanism.
      - "A reusable deployment framework always updates office before home."
        Selects an installation's policy for a generic contract; that order may
        belong in the contract of a concrete delivered instance.
      - "The process has no Plan and Validate steps."
        Describes absent entities rather than the current system.

      Each coherent architecture point links to its owning requirement heading,
      for example [REQ-001](requirements.md#req-001-title). Independent points need
      their own links; cross-spec links include the owning spec's relative path.
      Check actual headings in the merged artifact: modified deltas retain the
      base heading. Reference owners without duplicating their contents.

      Develop system architecture and code together by work item. Revisit and
      correct proposal or requirements when necessary. Pending item sections are
      allowed during implementation. Complete only the current item's design
      before coding it; later sections may remain pending. In every mode, an
      independent design arbiter reviews the item and corrections are resolved.
      Full involvement and code-only delegation then require user design review
      before that item is implemented. Full delegation accepts design autonomously.
      Validate system only after all affected item designs and code reviews are
      complete. Add a brief special-check description on explicit user request.
      Ordinary tests and code review are part of implementation.
      Create ADRs, including amendments and superseding records, only on explicit
      user request.
    deltaInstruction: |
      Write deltas at {{change.path}}/deltas/<workspace>/<capability-path>/system.md.delta.yaml.
      Target complete sections by heading and preserve unaffected contracts.
      Before final validation, replace pending markers with the implemented design.
    validations:
      - id: has-system-heading
        type: section
        level: 1
        required: true
    rules:
      post:
        - id: content-review
          instruction: *content-review

  - id: adrs
    scope: spec
    optional: true
    output: adrs.md
    description: Explicitly requested significant decision rationale and history
    template: templates/adrs.md
    requires: [requirements, system]
    delta: true
    instruction: |
      Create ADRs only on explicit user request, including amendments and
      superseding records. In a requested ADR, record a significant choice, status,
      context, relevant alternatives, rationale and consequences in one section per
      decision. Requirements and system own current needs and contracts; adopt a
      decision's current consequences there. Existing ADRs preserve the reasons
      and history of choices arising during requirements, architecture or
      implementation. Preserve superseded decisions with a link to their
      replacement. Clarifications explain the original decision and identify later
      knowledge accurately. A user-requested amendment or superseding ADR records
      material changes to the choice, decisive rationale or trade-off.
    deltaInstruction: |
      For an explicitly requested ADR, write deltas at
      {{change.path}}/deltas/<workspace>/<capability-path>/adrs.md.delta.yaml.
      Target whole ADR sections; added operations include the section heading.
    rules:
      post:
        - id: content-review
          instruction: *content-review

metadataExtraction:
  title:
    artifact: requirements
    extractor:
      selector: { type: section, level: 1 }
      extract: label
  description:
    artifact: requirements
    extractor:
      selector: { type: section, level: 1 }
      extract: content
  rules:
    - id: requirements
      artifact: requirements
      extractor:
        selector:
          type: section
          matches: '^(REQ-[0-9]+:|Requirement:)'
        groupBy: label
        extract: content
  constraints:
    - id: system-constraints
      artifact: system
      extractor:
        selector:
          type: list-item
          parent: { type: section, matches: '^Constraints$' }
        extract: label
  scenarios:
    - id: acceptance-scenarios
      artifact: requirements
      extractor:
        selector:
          type: section
          matches: '^Scenario:'
          parent: { type: section, matches: '^(REQ-[0-9]+:|Requirement:)' }
        fields:
          name: { from: label, strip: '^Scenario:\s*' }
          requirement: { from: parentLabel, strip: '^Requirement:\s*' }
          given:
            childSelector: { type: list-item, matches: '^GIVEN\b' }
            capture: '^GIVEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
          when:
            childSelector: { type: list-item, matches: '^WHEN\b' }
            capture: '^WHEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
          then:
            childSelector: { type: list-item, matches: '^THEN\b' }
            capture: '^THEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
  context:
    - id: requirements-overview
      artifact: requirements
      extractor:
        selector: { type: section, level: 1 }
        extract: content


workflow:
  - step: designing
    requires: []
    hooks:
      pre:
        - id: initial-artifacts
          instruction: |
            The main agent creates the proposal first and coordinates its
            independent agent review and corrections before user review. After
            user proposal comments are resolved, always ask this new change's
            involvement question and wait for the answer before requirements or
            the external-interface system skeleton. Earlier preferences do not
            replace the question. Record the reviewed proposal revision and
            actual asked/answered level; resume that same proposal using its
            recorded answer.

            The levels are full involvement, delegate code only and full
            delegation. Full involvement includes user review of agent-reviewed
            requirements, item designs and code. Code-only delegation includes
            user review of agent-reviewed requirements and item designs, with
            autonomous code. Full delegation handles downstream work autonomously.
            Independent design and separate code arbiters participate in every
            mode. Resolve agent findings before every user review.

            After the answer, prepare requirements and the system skeleton using
            live CLI instructions and merged previews. Check exact proposal item
            names/order or sufficient existing contracts for a no-op fix. Validate
            proposal and requirements before implementation; system may remain
            partial. Research agents may supply concise context as needed.

  - step: ready
    requires: [proposal, requirements]
    hooks:
      pre:
        - id: incremental-readiness
          instruction: |
            Confirm the external interface and matching work-item skeleton exist,
            or sufficient existing system contracts cover a narrow no-op fix.
            Confirm this change's proposal review and actual involvement answer
            are recorded and requirements have passed the mode's agent and user
            reviews. Item/batch presentation is a separate preference. Completing
            later items' architecture is not a prerequisite for coding an item.

  - step: implementing
    requires: [proposal, requirements]
    hooks:
      pre:
        - id: work-items
          instruction: |
            Work through proposal items in order. Each executor reads its sources,
            writes the brief system design and self-reviews. An independent design
            arbiter reviews it in every involvement mode and may ask implementation
            questions; retain only architecturally relevant answers in system.
            Resolve agent findings before user design review, required in full
            involvement and code-only delegation. Full delegation accepts the
            reviewed design autonomously. The same executor then implements the
            item, runs appropriate tests and self-reviews. Another independent
            arbiter reviews code, separate from executor and design arbiter, in
            every mode. Resolve its findings before full-involvement user code
            review. Code-only delegation and full delegation accept reviewed code
            autonomously. Complete the checkbox after checks, corrections and
            the mode's required user reviews pass.

            Minor earlier-item corrections and their affected design may be made
            autonomously; stop for the user's decision on significant inconsistencies.
            Forward later user questions and corrections to the original item
            executor. Keep every original executor available or resumable through
            human review, including batch review; the orchestrator neither edits
            its work itself nor silently substitutes another author. Report an
            unavailable original executor as a limitation.

            Code, docstrings and permanent code documentation link to existing
            enduring documents and headings, such as the owning requirements and
            system in specs/. Authors and reviewers check that targets remain
            meaningful after archive. Create commits when project rules or the
            user's request authorize them.

  - step: verifying
    requires: [proposal, requirements, system]
    requiresTaskCompletion: [proposal]
    hooks:
      pre:
        - id: verify-result
          instruction: |
            Require complete aligned system content and finished item code reviews
            before final structural validation. Confirm tests and review cover the
            affected requirements and design, including requested special checks.
            Confirm the recorded involvement mode's user checkpoints are complete:
            full involvement covers agent-reviewed requirements, item designs and
            code; code-only delegation covers agent-reviewed requirements and
            designs; full delegation receives a change ready for closure. Every
            human-presented result first passes independent review and corrections.
            Return feedback to the original item executor. Keep those executors available
            or resumable until human review ends. Surface significant inconsistencies
            for the user's decision; correct minor findings and recheck affected work.

  - step: archiving
    requires: [proposal, requirements, system]
    requiresTaskCompletion: [proposal]
    hooks:
      pre:
        - id: archive-current-contracts
          instruction: |
            Confirm the complete requirements and system match implementation,
            requested checks pass, item reviews are finished and the selected human
            review is satisfied. Preserve optional ADR history and durable link
            targets. Follow real-user-only CLI approval gates when configured.
      post:
        - id: summarise-archive
          instruction: |
            Summarize the changed needs, interfaces and architecture.
