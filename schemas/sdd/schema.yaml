kind: schema
name: sdd
version: 1
description: Concise Updates and incremental architectural changes.

artifacts:
  - id: proposal
    scope: change
    output: proposal.md
    description: Change intent, type and allocation among artifacts
    template: templates/proposal.md
    requires: []
    instruction: |
      Write a short problem statement, scope and change type. Choose Update for
      a localized change to an existing solution; choose Architectural change
      for a new solution or changed relationships between its parts. Classify by
      architectural decisions needed, not code volume. The main agent uses SDD
      artifacts only; delegate missing context to a research subagent.

      Allocate actual content in a compact table: number, one- or two-word topic,
      destination. Each complete row is at most 80 characters. Follow it with a
      numbered list using the same numbers and exactly one explanatory sentence
      per topic. Destinations are live schema artifact IDs, plus code for
      implementation (including rules/schema/skills) and context for supporting
      orientation files. Concrete filenames belong in explanations when useful.
      Allocation topics are not implementation tasks.

      For Architectural change only, add a short proposed-system outline whose
      points describe solution parts and also serve as the implementation plan.
      Ordinary tests and usage docs stay with the related part's implementation,
      not standalone outline points. Update needs no outline or
      plan and may leave all other SDD artifacts unchanged. List affected spec
      IDs, including owning specs whose needs remain unchanged. Keep research,
      progress and continuation outside the artifact dependency graph.

      After writing the proposal, ask the user to select full involvement,
      partial involvement or full delegation unless they already selected a
      level maximally explicitly. Never infer a selection from indirect signals.
      Record the explicit choice in continuation and reuse it on resume. The
      user can change it at any time; apply changes immediately to remaining work.
      Full involvement waits for user approval of successive artifacts and each
      design/code stage and transition in either direction. Partial involvement
      independently prepares initial design (architectural API/skeleton, or needed
      Update design), obtains user review, then independently implements and
      returns the result. Full delegation independently delivers ready for
      archiving. An independent nonauthor arbiter checks every artifact before
      user review; resolve findings first. Use the same independent arbiters for
      design then code. Archive only at the user's command in every mode.
    rules:
      post:
        - id: content-review
          instruction: &content-review |
            Reread the affected artifact, using the merged result for a delta.
            Correct misplaced content, contradictions and unsupported statements.
            Reject ordinary tests/docs promoted into architectural outline or
            system sections. A request to write/run tests alone does not request
            special-check prose in system; require that description explicitly.
            Replace the wrong account and dependent explanations; keep correction
            history outside current contracts. Keep only text that resolves a
            concrete ambiguity. Apply the proposal's review boundary or, for
            downstream content, this change's recorded involvement mode.
            Complete independent agent review and corrections before any user review.

  - id: requirements
    scope: spec
    output: requirements.md
    description: Needs, obligations and requirement-owned acceptance scenarios
    template: templates/requirements.md
    requires: [proposal]
    delta: true
    instruction: |
      Follow the user's explicit involvement level after proposal preparation.
      Full involvement requires proposal approval before the next artifact;
      partial involvement and full delegation prepare initial artifacts
      independently. Do not guess a missing level or ignore unresolved comments.

      Describe independent user/project needs and satisfaction conditions for
      each affected spec. Reuse existing requirements and authoritative artifact
      rules; use a no-op delta when the needs remain unchanged. A defect in their
      realization may be corrected under an existing requirement. Ask whether
      the need remains meaningful if its internal mechanism or configuration
      interface changes. State imposed negative constraints with their observable
      violation and acceptance scenarios.

      Keep the existing requirements format:
      - Start with # Requirements.
      - Use ## REQ-<n>: <name> or ## Requirement: <name> for each requirement.
      - State the core need concisely; add rationale when useful.
      - Give every requirement at least one ### Scenario: <name> section inside it.
      - GIVEN is optional; WHEN and THEN are required; AND may extend any clause.
      - Use the consumer's requirement-level language. Internal configuration,
        module/file choices and migration mechanics belong elsewhere unless they
        are themselves part of the required external contract.
      Put examples, nuances and boundary cases in scenarios. A proposed requirement
      that merely refines another is usually a scenario under its existing owner.
    deltaInstruction: |
      Write deltas at {{change.path}}/deltas/<workspace>/<capability-path>/requirements.md.delta.yaml.
      Target whole requirement sections. Modified operations replace the body
      under the existing heading; added operations include the heading and body.
    validations:
      - id: has-requirement
        type: section
        matches: '^(REQ-[0-9]+:|Requirement:)'
        required: true
      - id: has-acceptance-scenario
        type: section
        matches: '^Scenario:'
        required: true
    rules:
      post:
        - id: content-review
          instruction: *content-review
        - id: requirements-review
          instruction: |
            Complete independent requirements review and corrections in every mode.
            Full involvement requires user approval before proceeding. Partial
            involvement includes requirements in the initial-design review;
            full delegation proceeds independently.

  - id: system
    scope: spec
    output: system.md
    description: External interface and concise architecture developed by work item
    template: templates/system.md
    requires: [requirements]
    delta: true
    instruction: |
      Follow the user's explicit involvement level and resolve affected comments.

      Start the affected system content with the designed entity's external
      interface. For Architectural change, create a skeleton matching the short
      proposed-system outline; its points also serve as the implementation plan.
      External means the entity's relevant boundary: public types/functions,
      REST, UI, CLI, protobuf, IOCTL, or another interface. Preserve and reference
      sufficient existing contracts; a narrow fix may use a no-op system delta.

      System owns current concepts, interfaces, configuration contracts, behavior,
      guarantees and invariants. For each item, record its role, named key
      participants, relationships with other modules and material external
      dependencies. Explain the arrangement or mechanism that realizes requirements
      and where its contracts are defined, so a reader can determine whether an
      implementation conforms. Define shared concepts once and keep architecture
      sufficient to distinguish a conforming implementation.

      Distinguish a reusable contract from values selected for an instance,
      deployment, policy or dataset. General framework contracts describe the
      reusable model; values defining a concrete delivered system may be part
      of that system's contract. An explicitly requested ADR records significant
      choice rationale; routine coding steps and temporary migration mechanics
      belong in implementation.

      Authoring examples use an illustrative host-update CLI with cli, config,
      deployment and completion modules.

      Good examples:
      - "host-update <host> --config <path> updates one configured target."
        Defines an external interface and target-selection contract.
      - "cli::Args uses clap to parse the public command."
        Names a module role and its argument-parsing library dependency.
      - "config::load produces Target; deployment::run consumes it; completion
        reads the shared command definition." Identifies module relationships
        and data flow.
      - "Deployment starts activation only after a successful build."
        States a material, assessable ordering invariant.
      - "Target contains public target settings; credentials remain in the SSH
        agent." Defines a data boundary and its external participant.
      - "A lock file records exact dependency revisions for deployment builds."
        Names a reproducibility mechanism whose underlying need can remain stable
        when the mechanism changes.

      Bad examples of System prose:
      - "Users can update their hosts." Repeats a need without its architecture.
      - "Create a map, loop over hosts and append each result."
        Gives ordinary coding steps that belong in implementation.
      - "The utility prints usage for an invalid set of arguments."
        Conventional correct CLI behavior and recitals of parsing-library
        facilities alone add no project-specific architecture.
      - "The function returns the constructed object as Result<Object, Error>."
        A standalone Rust idiom does not itself expose a significant contract;
        actual external API definitions and material error behavior can belong
        in system.
      - "Deployment may use SSH or a new service; the choice comes later."
        Leaves a material choice unresolved in a finished item's contract;
        pending questions belong with unfinished work.
      - "We first chose A, then the reviewer suggested B."
        Records discussion history instead of the current contract and mechanism.
      - "A reusable deployment framework always updates office before home."
        Selects an installation's policy for a generic contract; that order may
        belong in the contract of a concrete delivered instance.
      - "The process has no Plan and Validate steps."
        Describes absent entities rather than the current system.

      Each coherent architecture point links to its owning requirement heading,
      for example [REQ-001](requirements.md#req-001-title). Independent points need
      their own links; cross-spec links include the owning spec's relative path.
      Check actual headings in the merged artifact: modified deltas retain the
      base heading. Reference owners without duplicating their contents.

      Develop system architecture and code together by work item. Revisit and
      correct proposal or requirements when necessary. Pending item sections are
      allowed during implementation. Complete only the current item's design
      before coding it; later sections may remain pending. In every mode, an
      independent design arbiter reviews the item and corrections are resolved.
      Full involvement requires user approval of every design/code stage and
      transition, including back to design. Partial involvement requires user
      review of the initial API/skeleton, then autonomous detailed design/code;
      for Update review necessary design changes before autonomous code.
      The same independent nonauthor arbiters check new or updated design before
      code, then preservation of other subsystems' requirements/design in code,
      then code cleanliness for the language/project. Resolve findings first.
      Final system validation uses complete designs and reviewed implementation;
      initial structural validation does not prevent later design evolution.
      Add a brief special-check description only when the user explicitly asks
      for that description in system. Asking to write or run tests alone does
      not do so; ordinary checks and usage docs stay with implementation.
      Ordinary tests and code review are part of implementation.
      Create ADRs, including amendments and superseding records, only on explicit
      user request.
    deltaInstruction: |
      Write deltas at {{change.path}}/deltas/<workspace>/<capability-path>/system.md.delta.yaml.
      Target complete sections by heading and preserve unaffected contracts.
      Before final validation, replace pending markers with the implemented design.
    validations:
      - id: has-system-heading
        type: section
        level: 1
        required: true
    rules:
      post:
        - id: content-review
          instruction: *content-review

  - id: adrs
    scope: spec
    optional: true
    output: adrs.md
    description: Explicitly requested significant decision rationale and history
    template: templates/adrs.md
    requires: [requirements, system]
    delta: true
    instruction: |
      Create ADRs only on explicit user request, including amendments and
      superseding records. In a requested ADR, record a significant choice, status,
      context, relevant alternatives, rationale and consequences in one section per
      decision. Requirements and system own current needs and contracts; adopt a
      decision's current consequences there. Existing ADRs preserve the reasons
      and history of choices arising during requirements, architecture or
      implementation. Preserve superseded decisions with a link to their
      replacement. Clarifications explain the original decision and identify later
      knowledge accurately. A user-requested amendment or superseding ADR records
      material changes to the choice, decisive rationale or trade-off.
    deltaInstruction: |
      For an explicitly requested ADR, write deltas at
      {{change.path}}/deltas/<workspace>/<capability-path>/adrs.md.delta.yaml.
      Target whole ADR sections; added operations include the section heading.
    rules:
      post:
        - id: content-review
          instruction: *content-review

metadataExtraction:
  title:
    artifact: requirements
    extractor:
      selector: { type: section, level: 1 }
      extract: label
  description:
    artifact: requirements
    extractor:
      selector: { type: section, level: 1 }
      extract: content
  rules:
    - id: requirements
      artifact: requirements
      extractor:
        selector:
          type: section
          matches: '^(REQ-[0-9]+:|Requirement:)'
        groupBy: label
        extract: content
  constraints:
    - id: system-constraints
      artifact: system
      extractor:
        selector:
          type: list-item
          parent: { type: section, matches: '^Constraints$' }
        extract: label
  scenarios:
    - id: acceptance-scenarios
      artifact: requirements
      extractor:
        selector:
          type: section
          matches: '^Scenario:'
          parent: { type: section, matches: '^(REQ-[0-9]+:|Requirement:)' }
        fields:
          name: { from: label, strip: '^Scenario:\s*' }
          requirement: { from: parentLabel, strip: '^Requirement:\s*' }
          given:
            childSelector: { type: list-item, matches: '^GIVEN\b' }
            capture: '^GIVEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
          when:
            childSelector: { type: list-item, matches: '^WHEN\b' }
            capture: '^WHEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
          then:
            childSelector: { type: list-item, matches: '^THEN\b' }
            capture: '^THEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
  context:
    - id: requirements-overview
      artifact: requirements
      extractor:
        selector: { type: section, level: 1 }
        extract: content


workflow:
  - step: designing
    requires: []
    hooks:
      pre:
        - id: initial-artifacts
          instruction: |
            The main agent uses SDD artifacts for proposal preparation; launch a
            researcher for additional context. Classify Update or Architectural
            change and follow the proposal's live format instructions. After
            writing it obtain an explicit involvement choice, unless already
            maximally explicitly supplied; never guess or ask again on resume.
            The user may change the level at any time. Apply the current level's
            checkpoints and independent artifact review before user review.
            Full involvement reviews successive artifacts and design/code stages.
            Partial involvement reviews the initial design, then delegates code.
            Full delegation delivers ready for archiving. Stop for the user's
            decision on serious inconsistencies, including issues requiring a
            hack or workaround even when they do not block progress.

  - step: ready
    requires: [proposal, requirements]
    hooks:
      pre:
        - id: incremental-readiness
          instruction: |
            Use validated proposal/requirements and the selected involvement
            level's reviews. Architectural change needs the external API and
            system skeleton/plan; Update needs only necessary artifact changes,
            which may be none. Reuse sufficient contracts with no-op deltas.
            Later architectural details do not delay a reviewed item's code.

  - step: implementing
    requires: [proposal, requirements]
    hooks:
      pre:
        - id: implementation-roles
          instruction: |
            The main agent never writes code or architectural details. Assign
            each architectural plan item to its own subagent for design and code.
            For Update, the main agent may edit design when it already knows the
            needed change; otherwise a researcher updates design and may then
            implement. Subagents write all code. Keep original authors resumable:
            user corrections must return to them, including the main agent for
            artifacts it authored; report unavailable authors instead of replacing.

            The same independent nonauthor arbiters first check new or updated
            design against other subsystems' requirements/design before coding;
            next check code preserves those contracts, then language/project
            cleanliness. Resolve findings before implementation review. Apply
            the current explicit involvement level, including user switches.
            Stop on serious inconsistencies, including hacks or workarounds,
            and ask the user how to proceed. Do not silently work around them.
            Durable links must survive archive. Commit only when authorized.

  - step: verifying
    requires: [proposal, requirements, system]
    hooks:
      pre:
        - id: verify-result
          instruction: |
            Confirm complete aligned system and reviewed implementation. Pass
            all applicable project, change-artifact, SpecD and user checks; these
            sources accumulate obligations. Process changes need standard and
            especially edge-case scenario tests: one tester per case launches
            its own executor with normal task/process context, no test framing
            or expected behaviour. Keep expectations outside executor context.
            Preserve every case's artifacts and report results with root links.
            Resolve reviews under the current explicit involvement level and
            route corrections to original authors. Archive only on user command.

  - step: archiving
    requires: [proposal, requirements, system]
    hooks:
      pre:
        - id: archive-current-contracts
          instruction: |
            Require the user's explicit archive command, all applicable checks,
            reviewed implementation and aligned validated current contracts.
            Preserve optional ADR history and durable links. Configured human-only
            approvals remain human-only. Do not infer archive authority from mode.
      post:
        - id: summarise-archive
          instruction: |
            After native archive succeeds, delete only proposal.md at the exact
            returned archivePath (relative to the project root when not absolute),
            preserving all other history and test artifacts.
            Report the archive result and remaining limits.
