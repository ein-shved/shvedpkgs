kind: schema
name: sdd
version: 1
description: Repository SDD workflow — requirements → system → validate → plan.

artifacts:
  - id: proposal
    scope: change
    output: proposal.md
    description: Change proposal explaining why the work exists and which SDD artifacts it affects
    template: templates/proposal.md
    requires: []
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Preserve the repository SDD model:
      - Requirements own needs and satisfaction conditions.
      - Acceptance scenarios belong inside requirements and use only
        requirement-level concepts.
      - System owns current system contracts and interfaces.
      - Validate owns technical validation design for system conformance.
      - Plan owns implementation strategy, validation strategy, and top-level
        plan items.
      - ADRs own significant decisions and rationale.

      Before authoring, select participation through the manager-loaded design
      procedure: involved (user decides and accepts content) or delegated
      (coordinator decides and accepts content within the user's goal).
      Reuse an explicit prior choice; batching alone does not delegate design.

      Estimate independent decisions and start with Category: small change or
      large architectural development, a short reason, and Participation:
      involved|delegated. Zero or one new need usually suggests small scope;
      several suggest architecture, but one broad need may hide many decisions.
      File count and code volume do not determine category. A new derive macro,
      protocol, generator, or statistics module usually needs architecture;
      a bug fix, float support in an established serialization model, a longer
      statistics window, or emission of an already supported type is usually small.

      Follow with a very short problem statement, a numbered table with columns
      #, Topic, Owning artifact, and matching numbered explanations of at most
      two sentences per item. Use short topics and only relevant destinations;
      unchanged needs may be marked requirements (no-op). Keep existing item
      numbers on correction and redisplay the entire corrected table in review.
      This table owns intent allocation; requirements reuse it without another
      allocation checkpoint. Material intent changes return to proposal review.
      Reclassify there when new decisions change the appropriate workflow.

      Put affected spec IDs and a link to change-local .context in a short footer.
      Keep detailed evidence, alternatives, and technical support in that file,
      outside the artifact DAG. Resolve material questions during proposal review.

      Identify affected specs even when their requirements stay unchanged.
      A schema or design defect can be fixed under an existing need; attach
      that spec and use a no-op requirements delta when appropriate. Keep
      motivation, current problems, direction, scope, and relevant technical
      context here without replacing requirements or system design.
    rules:
      post:
        - id: resolve-open-questions
          instruction: |
            Review unresolved questions. Resolve any question that can
            change requirements, system specification, validation, or plan
            artifacts
            before proceeding.
        - id: boundary-self-review
          instruction: |
            Reread the draft, including its merged result for a delta. Check
            changed statements against proposal ownership and any agreed intent
            allocation: does this explain motivation, direction, and scope
            without replacing the owning requirements or system design?
            On every correction, replace or remove the wrong statement and its
            dependent explanations. Reread the whole affected section: remove
            residual errors, contradictions, repetition, and contrasts to the
            rejected account. Describe current behavior directly. A negative
            contract needs an independent current basis; a prior mistake does
            not justify a counterclaim or new prohibition. Keep correction
            history in chat or discovery notes. Accept sufficient compact text;
            an expansion request must name the incorrect implementation that
            current wording still permits. No general word or line quota applies.
            Identify specific misplaced or unsupported passages and correct
            them before decision-owner review; a generic compliance assertion is
            insufficient. Surface any needed upstream change instead of
            silently modifying approved content. Revised content follows decision-owner
            review. Add no separate report, section, or confirmation step;
            mention only material corrections or unresolved issues in chat.
        - id: review-before-validation
          instruction: &review-before-validation |
            After self-review and the first-draft independent arbiter check,
            present the current artifact to the design decision owner: the
            user in involved mode or the coordinator in delegated mode. Stop
            before specd changes validate until that owner accepts this revision
            and a final independent arbiter check succeeds on the same content.
            Apply the manager's three arbiter triggers: first completed draft,
            owner acceptance, or explicit user/coordinator request. Consecutive
            owner comments use executor self-review, not fresh arbiter launches.
            Reuse the arbiter within its correction cycle; close it on success
            or escalation. This applies to every authored
            artifact, including optional ADRs, deltas, and no-op decisions.
            For deltas, present the merged artifact; a no-op refers to the
            unchanged base. Explicit decision-owner approval covers only current content.
            A revision request or generation-mode selection, including
            all-at-once generation, is not content approval. Intent allocation
            agreement alone does not approve subsequently drafted content.

            Mode selection approves no draft. Delegated acceptance is recorded
            for a concrete revision; human-only CLI spec/signoff gates remain
            real-user actions. System subscopes close after review, but validate
            the system artifact only after all sections and integration finish.

            After matching approval and final review, structurally validate.
            If validation requires content changes, including upstream repairs,
            present their diff and wait for decision-owner approval and final
            review of revised content before
            revalidation. Never silently edit or validate unapproved upstream
            artifacts to repair dependencies. Reuse an existing approval while
            reviewed content is unchanged; state-only dependency changes do not
            require repeating that review. Tests and technical inspections are
            distinct from artifact-content approval. This is an agent rule,
            not a new CLI approval state or separate approval document.

  - id: requirements
    scope: spec
    output: requirements.md
    description: SDD requirements describing needs, obligations, rationale, and requirement-level acceptance scenarios
    template: templates/requirements.md
    requires:
      - proposal
    delta: true
    instruction: |
      Create or update the requirements artifact for every spec affected by the
      proposal.

      Requirements describe WHAT need or obligation the system must satisfy.
      They do not own implementation files, package placement, migration steps,
      internal module structure, or historical implementation notes.
      Acceptance scenarios are part of requirements. They describe observable
      satisfaction conditions in requirement-level language, not implementation
      mechanics or system-design internals.

      First check existing requirements and authoritative process rules.
      A defect in their realization does not necessarily introduce a new need.
      Use a no-op requirements delta when the owning needs remain unchanged.
      Patch constraints, defect descriptions, and proposed fixes belong with
      proposal, system, or plan according to their responsibility.

      An absent obligation or dismissed capability does not create a need or
      prohibition. Preserve genuinely imposed negative constraints with their
      observable violation and acceptance scenarios; judge the need, not negation.

      Keep requirement prose concise. A reader should be able to understand the
      core need first, then return to scenarios for nuance, boundary cases,
      examples, and clarifications.
      Treat an overly long requirement body as a warning sign: move details,
      examples, edge cases, and clarifications into scenarios unless they are
      essential to understanding the requirement itself.

      Every requirement must have at least one acceptance scenario. If a
      proposed requirement mostly clarifies, narrows, or gives an example of
      another requirement, treat it as a candidate for conversion into a
      scenario under that requirement instead of creating a separate
      requirement.

      Format requirements:
      - Top-level heading: `# Requirements`
      - Each requirement uses `## REQ-<n>: <name>` or
        `## Requirement: <name>`.
      - Include rationale where it helps future readers.
      - Express satisfaction with mandatory `### Scenario: <name>` sections
        inside the owning requirement.
      - Each scenario belongs to exactly one requirement: place it under the
        owning requirement, not as a file-level section.
      - Use OpenSpec-style scenario clauses:
        - `GIVEN` is optional.
        - `WHEN` is required.
        - `THEN` is required.
        - `AND` may extend any preceding `GIVEN`, `WHEN`, or `THEN` clause.
        - Multiple scenarios per requirement are allowed and encouraged when
          they make nuance easier to read.
      - Acceptance scenarios must use the terms available to the requirement's
        consumer. Do not mention implementation configuration, package buckets,
        internal module names, or design-only concepts unless they are part of
        the requirement itself.
    deltaInstruction: |
      For modified requirements, write a delta file at
      `{{change.path}}/deltas/<workspace>/<capability-path>/requirements.md.delta.yaml`.

      Target whole requirement sections. Modified operations replace the body
      under the existing heading. Added operations include the full requirement
      heading and body.
    validations:
      - id: has-requirement
        type: section
        matches: '^(REQ-[0-9]+:|Requirement:)'
        required: true
      - id: has-acceptance-scenario
        type: section
        matches: '^Scenario:'
        required: true
    rules:
      pre:
        - id: consume-proposal-allocation
          instruction: |
            Read the accepted proposal's numbered allocation against existing
            requirements and authoritative process rules. Reuse that allocation;
            do not introduce a separate intent checkpoint. Material changes
            return to proposal review, preserving item identities and replaying
            the full corrected table. Intent allocation does not approve later
            artifact content. Draft only the currently assigned artifact scope.
      post:
        - id: boundary-self-review
          instruction: |
            Reread the draft, including its merged result for a delta or the
            unchanged base for a no-op. Check changed statements against
            requirements ownership and any agreed intent allocation. What
            independent user or project need does each addition express? Is it
            already covered by requirements or authoritative process rules?
            Would it still make sense with a different implementation? Patch
            constraints, defect descriptions, and proposed fixes do not become
            requirements merely because the user mentioned them. Unchanged
            needs can use a no-op delta.
            On every correction, replace or remove the wrong statement and its
            dependent explanations. Reread the whole affected section: remove
            residual errors, contradictions, repetition, and contrasts to the
            rejected account. Describe current behavior directly. A negative
            contract needs an independent current basis; a prior mistake does
            not justify a counterclaim or new prohibition. Keep correction
            history in chat or discovery notes. Accept sufficient compact text;
            an expansion request must name the incorrect implementation that
            current wording still permits. No general word or line quota applies.
            Identify specific misplaced or unsupported passages and correct
            them before decision-owner review; a generic compliance assertion is
            insufficient. Surface any needed upstream change instead of
            silently modifying approved content. Revised content follows decision-owner
            review. Add no separate report, section, or confirmation step;
            mention only material corrections or unresolved issues in chat.
        - id: review-before-validation
          instruction: *review-before-validation

  - id: system
    scope: spec
    output: system.md
    description: SDD system specification describing current contracts, concepts, layers, and interfaces
    template: templates/system.md
    requires:
      - requirements
    delta: true
    instruction: |
      Create or update the system specification artifact for every affected
      spec.

      The system specification maps requirements to the current system model:
      concepts, interfaces, invariants, layers, host classification, package
      buckets, validation outputs, and other current contracts.

      Explain HOW components, relationships, interactions, and mechanisms
      realize requirements. Identify where contracts are defined; restated
      obligations or abstract guarantees alone are insufficient. Put significant
      choice rationale in ADRs and technical check procedures in validate.

      At each architecture point's owning section, definition, or list item,
      link explicitly to its owning requirement heading. Use resolvable
      Markdown links, for example `[REQ-001](requirements.md#req-001-title)`;
      cross-spec links include the owning spec's relative path. A section-level
      reference covers one coherent point; independent points each need their
      own references. Reference owners without copying their content.

      Do not put implementation sequencing or plan-item checklist detail here;
      that belongs in the plan.

      Describe responsibilities, interfaces, interactions, and material behavior
      once, concretely enough to distinguish a conforming implementation. Use
      tables for repeated entities/states and links to shared definitions.
      Common rules have one owner; local sections give application and differences.
      Extra prose must resolve a concrete ambiguity. Mark partial coverage locally
      and resolve missing information needed by this change.

      For large architectural development, first author an overview of actors,
      subsystem responsibilities, interfaces, relationships, and main flows;
      prepare pending subsystem skeletons with inputs and open questions.
      The manager tracks ordered overview/subsystem/integration scopes in
      change-local .context. Each subsystem gets a fresh focused author group.
      Surface changed approved interfaces for decision-owner review and
      reconsider affected earlier/dependent scopes. Keep one system artifact;
      validate it only after every affected section and integrated revision is
      complete and reviewed. Validate and plan consume that complete system.
    deltaInstruction: |
      For modified system specification content, write a delta file at
      `{{change.path}}/deltas/<workspace>/<capability-path>/system.md.delta.yaml`.

      Target complete sections by heading. Keep the updated section complete
      enough to remain correct after archive.
    validations:
      - id: has-system-heading
        type: section
        level: 1
        required: true
    rules:
      post:
        - id: boundary-self-review
          instruction: |
            Reread the draft, including its merged result for a delta. Check
            changed statements against system ownership and any agreed intent
            allocation. Does each architecture point explain a concrete
            arrangement or mechanism, identify where its contracts are defined,
            and link to its owning requirement? Are transition steps and
            technical check procedures left to plan and validate?
            On every correction, replace or remove the wrong statement and its
            dependent explanations. Reread the whole affected section: remove
            residual errors, contradictions, repetition, and contrasts to the
            rejected account. Describe current behavior directly. A negative
            contract needs an independent current basis; a prior mistake does
            not justify a counterclaim or new prohibition. Keep correction
            history in chat or discovery notes. Accept sufficient compact text;
            an expansion request must name the incorrect implementation that
            current wording still permits. No general word or line quota applies.
            Identify specific misplaced or unsupported passages and correct
            them before decision-owner review; a generic compliance assertion is
            insufficient. Surface any needed upstream change instead of
            silently modifying approved content. Revised content follows decision-owner
            review. Add no separate report, section, or confirmation step;
            mention only material corrections or unresolved issues in chat.
        - id: review-before-validation
          instruction: *review-before-validation

  - id: validate
    scope: spec
    output: validate.md
    description: Technical validation design for system conformance
    template: templates/validate.md
    requires:
      - requirements
      - system
    delta: true
    instruction: |
      Create or update the technical validation artifact for the affected
      requirements and system contracts.

      This artifact owns HOW the implementation will be checked against the
      requirements and system model. It may name concrete tests, commands,
      inspections, fixtures, validation configurations, and validation support
      described by other system artifacts.

      Do not write acceptance scenarios here. Acceptance scenarios belong in
      requirements. Validation may reference those scenarios, but it must focus
      on technical evidence and coverage.

      Each check must have a Covers link to its owning requirement heading or
      relevant system.md heading, a Method specifying the concrete action to
      perform, and Evidence describing the expected result. Use resolvable
      Markdown links; cross-spec links include the owning spec's relative path.
      Notes hold only needed setup, prerequisites, or execution limits.
      A coverage overview lists references only. Do not include purpose or
      motivation prose in this artifact.

      Separate Automated Checks from Manual Checks. Automated entries name
      asserted cases and the actual runner/test; executable details live in
      tests. Before replacing a recipe with a reference, inspect that the runner
      executes and asserts its claimed cases. Fixtures/snapshots alone do not
      establish coverage. Retain concrete manual actions and expected results,
      including conditional runtime duties left uncovered by tests. Permanent
      checks work without change history; migration/before-and-after comparisons
      belong in plan. Preserve uncovered duties when condensing the artifact.
    deltaInstruction: |
      For modified validation content, write a delta file at
      `{{change.path}}/deltas/<workspace>/<capability-path>/validate.md.delta.yaml`.

      Target complete validation sections by heading. Keep each section precise
      about what is checked, what command/test/inspection provides evidence,
      and which requirement or system contract it covers.
    validations:
      - id: has-validation-heading
        type: section
        level: 1
        required: true
    rules:
      post:
        - id: boundary-self-review
          instruction: |
            Reread the draft, including its merged result for a delta. Check
            changed statements against validate ownership and any agreed intent
            allocation. Does every check specify a concrete action, an expected
            result, and a requirement or architecture link? Are acceptance
            conditions and motivation left with their upstream owners?
            On every correction, replace or remove the wrong statement and its
            dependent explanations. Reread the whole affected section: remove
            residual errors, contradictions, repetition, and contrasts to the
            rejected account. Describe current behavior directly. A negative
            contract needs an independent current basis; a prior mistake does
            not justify a counterclaim or new prohibition. Keep correction
            history in chat or discovery notes. Accept sufficient compact text;
            an expansion request must name the incorrect implementation that
            current wording still permits. No general word or line quota applies.
            Identify specific misplaced or unsupported passages and correct
            them before decision-owner review; a generic compliance assertion is
            insufficient. Surface any needed upstream change instead of
            silently modifying approved content. Revised content follows decision-owner
            review. Add no separate report, section, or confirmation step;
            mention only material corrections or unresolved issues in chat.
        - id: review-before-validation
          instruction: *review-before-validation

  - id: adrs
    scope: spec
    optional: true
    output: adrs.md
    description: Durable architecture decision records for significant spec decisions
    template: templates/adrs.md
    requires:
      - requirements
      - system
    delta: true
    instruction: |
      Create or update ADRs only when the affected spec has significant
      decisions whose rationale must remain durable after the change is
      archived.

      ADRs preserve decision history and rationale. They are not the primary
      source of current required behavior or current system guarantees; those
      belong in requirements and system artifacts. If an ADR changes current
      system truth, update the owning requirements, system, and validation
      artifacts as well.

      Store multiple decisions as sections in this single artifact. Preserve
      superseded decisions instead of rewriting history.
    deltaInstruction: |
      For modified ADR content, write a delta file at
      `{{change.path}}/deltas/<workspace>/<capability-path>/adrs.md.delta.yaml`.

      Target complete ADR sections by heading. Added operations include the full
      ADR section with status, context, decision, rationale, and consequences.
    rules:
      post:
        - id: boundary-self-review
          instruction: |
            Reread the draft, including its merged result for a delta. Check
            changed statements against ADR ownership and any agreed intent
            allocation. Does this record a significant choice and its rationale
            without becoming the source of current requirements or system
            mechanisms?
            On every correction, replace or remove the wrong statement and its
            dependent explanations. Reread the whole affected section: remove
            residual errors, contradictions, repetition, and contrasts to the
            rejected account. Describe current behavior directly. A negative
            contract needs an independent current basis; a prior mistake does
            not justify a counterclaim or new prohibition. Keep correction
            history in chat or discovery notes. Accept sufficient compact text;
            an expansion request must name the incorrect implementation that
            current wording still permits. No general word or line quota applies.
            Identify specific misplaced or unsupported passages and correct
            them before decision-owner review; a generic compliance assertion is
            insufficient. Surface any needed upstream change instead of
            silently modifying approved content. Revised content follows decision-owner
            review. Add no separate report, section, or confirmation step;
            mention only material corrections or unresolved issues in chat.
        - id: review-before-validation
          instruction: *review-before-validation

  - id: plan
    scope: change
    hasTasks: true
    output: plan.md
    description: SDD implementation plan with validation strategy and top-level plan items
    template: templates/plan.md
    requires:
      - requirements
      - system
      - validate
    instruction: |
      Create the implementation plan for this change.

      Start with an ordered list of executable work items. Each item names
      concrete work, code locations and any identifiers needed to locate or
      create the affected modules, plus links to the relevant accepted
      architecture and completion checks. State dependencies when list order
      alone does not make them clear.

      Choose detail from the gap between the current implementation and the
      accepted design, including migration uncertainty and ordering risks.
      The proposal's small/large category does not determine plan length.
      For broad new development or a small feature already resolved by the
      architecture, module order, useful code paths/names, and architecture
      and validation links may be sufficient. Reference the existing design
      and checks rather than repeating their contracts or procedures.

      For substantial changes to existing code or internal APIs, identify the
      affected parts to reuse unchanged, adapt, remove, replace, or write anew.
      Explain affected callers, migration order,
      any required compatibility period, and transition/preservation checks
      sufficiently to make the work unambiguous. A compact old-to-new mapping
      can help. Significant target-contract decisions remain in system;
      the plan describes how existing code reaches that accepted design.

      Assumptions, constraints, risks, or scope boundaries belong here when
      they affect execution. Put them with the affected items or add shared
      context when it helps several items. The template is a starting task
      list, not a required section catalogue. Add sections only for useful
      transition information; avoid empty scaffolding and duplicate summaries.
      Migration and before/after checks belong here; permanent conformance
      procedures remain in validate. Preserve uncovered manual duties.

      Top-level plan items are the executable work units for implementation.
      Each top-level plan item must be independently completable and must
      include or reference the validation needed to prove that item reaches an
      agreed state. Smaller execution steps may be nested under a plan item
      when helpful, but they are local execution structure rather than separate
      process artifacts.

      During implementation, edits to the approved plan are limited to marking
      completed work from [ ] to [x]. Add no prose, steps, execution reports, or
      embellishments. Neither ask permission nor proactively propose to append
      to the plan. Keep temporary execution tracking and chat progress outside
      it. Retain this boundary during verification and archive.

      Surface an actual design error and wait for explicit design-decision-owner permission
      before returning to designing to correct the earliest affected artifact.
      Routine implementation choices do not trigger design revisions.
    rules:
      post:
        - id: upstream-coverage
          instruction: |
            Cross-check the plan against requirements, system, and validate
            artifacts. Every requirement, acceptance scenario, and validation
            check must have a path through the plan.
            Assess coverage through the items' architecture and validation
            references. One reference may cover a coherent group of obligations;
            add a separate mapping only when needed to expose a coverage gap.
        - id: boundary-self-review
          instruction: |
            Reread the draft, including its merged result for a delta. Check
            changed statements against plan ownership and any agreed intent
            allocation. Does this describe the implementation transition and
            completion evidence without introducing new needs or significant
            system design?
            On every correction, replace or remove the wrong statement and its
            dependent explanations. Reread the whole affected section: remove
            residual errors, contradictions, repetition, and contrasts to the
            rejected account. Describe current behavior directly. A negative
            contract needs an independent current basis; a prior mistake does
            not justify a counterclaim or new prohibition. Keep correction
            history in chat or discovery notes. Accept sufficient compact text;
            an expansion request must name the incorrect implementation that
            current wording still permits. No general word or line quota applies.
            Identify specific misplaced or unsupported passages and correct
            them before decision-owner review; a generic compliance assertion is
            insufficient. Surface any needed upstream change instead of
            silently modifying approved content. Revised content follows decision-owner
            review. Add no separate report, section, or confirmation step;
            mention only material corrections or unresolved issues in chat.
        - id: review-before-validation
          instruction: *review-before-validation
    preHashCleanup:
      - id: normalize-checkboxes
        pattern: '^([ \t]*-\s+)\[x\]'
        replacement: '$1[ ]'
    taskCompletionCheck:
      incompletePattern: '^\s*-\s+\[ \]'
      completePattern: '^\s*-\s+\[x\]'

metadataExtraction:
  title:
    artifact: requirements
    extractor:
      selector: { type: section, level: 1 }
      extract: label
  description:
    artifact: requirements
    extractor:
      selector: { type: section, level: 1 }
      extract: content
  rules:
    - id: requirements
      artifact: requirements
      extractor:
        selector:
          type: section
          matches: '^(REQ-[0-9]+:|Requirement:)'
        groupBy: label
        extract: content
  constraints:
    - id: system-constraints
      artifact: system
      extractor:
        selector:
          type: list-item
          parent: { type: section, matches: '^Constraints$' }
        extract: label
  scenarios:
    - id: acceptance-scenarios
      artifact: requirements
      extractor:
        selector:
          type: section
          matches: '^Scenario:'
          parent: { type: section, matches: '^(REQ-[0-9]+:|Requirement:)' }
        fields:
          name: { from: label, strip: '^Scenario:\s*' }
          requirement: { from: parentLabel, strip: '^Requirement:\s*' }
          given:
            childSelector: { type: list-item, matches: '^GIVEN\b' }
            capture: '^GIVEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
          when:
            childSelector: { type: list-item, matches: '^WHEN\b' }
            capture: '^WHEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
          then:
            childSelector: { type: list-item, matches: '^THEN\b' }
            capture: '^THEN\s+(.+)'
            followSiblings: '^(?:AND|OR)\b'
  context:
    - id: requirements-overview
      artifact: requirements
      extractor:
        selector: { type: section, level: 1 }
        extract: content

workflow:
  - step: designing
    requires: []
    hooks:
      pre:
        - id: designing-guidance
          instruction: |
            Preserve the SDD dependency direction:
            requirements -> system -> validate -> plan -> implementation.
            Discovery may move upstream; corrections must propagate downstream.

            Use the proposal's numbered allocation; there is no separate
            requirements-intent checkpoint. Correct material intent in proposal.
            Apply the selected participation mode and manager scope policy.
        - id: review-before-validation
          instruction: *review-before-validation

  - step: ready
    requires: [proposal, requirements, system, validate, plan]
    hooks:
      pre:
        - id: ready-guidance
          instruction: |
            Verify that requirements, system, validate, and plan are all complete
            and aligned before implementation starts.

  - step: implementing
    requires: [proposal, requirements, system, validate, plan]
    hooks:
      pre:
        - id: implementing-guidance
          instruction: |
            Read requirements, system, validate, and plan before coding.
            Implement top-level plan items in order and mark checkboxes
            complete as work is done. Edits to the approved plan are limited
            to completed [ ] -> [x] marks. Add no prose, steps, execution
            reports, or embellishments. Neither ask permission nor proactively
            propose to append to the plan. Keep temporary tracking and chat
            progress outside it.

            If implementation reveals an actual design error, surface it and
            wait for explicit design-decision-owner permission before returning to designing
            to correct the earliest affected artifact. Routine implementation
            choices do not trigger design revisions.

  - step: verifying
    requires: [proposal, requirements, system, validate, plan]
    requiresTaskCompletion: [plan]
    hooks:
      pre:
        - id: verifying-guidance
          instruction: |
            Run or inspect the validation checks described by validate. Confirm
            that acceptance scenarios in requirements are covered by technical
            evidence. If checks fail because code is wrong, return to
            implementing. If checks reveal an actual design error, surface it
            and wait for explicit design-decision-owner permission before returning to designing
            to correct the earliest affected artifact. Keep progress outside
            the approved plan; during implementation, only completed checkbox
            marks may change. Add no prose or steps and neither ask permission
            nor proactively propose to append to the plan.

  - step: archiving
    requires: [proposal, requirements, system, validate, plan]
    requiresTaskCompletion: [plan]
    hooks:
      pre:
        - id: archiving-guidance
          instruction: |
            Confirm archived requirements and system specification will match
            the implemented behavior. Do not archive stale or incomplete
            artifacts.

            If implementation reveals that requirements, system specification,
            validation, or ADRs contain an actual design error, surface it and
            wait for explicit design-decision-owner permission before returning to designing
            to correct the earliest affected artifact before archive. Keep
            progress outside the approved plan; during implementation, only
            completed checkbox marks may change. Add no prose or steps and
            neither ask permission nor proactively propose to append to it.
      post:
        - id: summarise-archive
          instruction: |
            Summarize the archived SDD artifacts and the requirements/system
            contracts that changed.
