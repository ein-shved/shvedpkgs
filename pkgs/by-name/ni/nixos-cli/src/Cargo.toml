[package]
name = "nixos-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nixos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.53", features = ["derive", "string"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
